name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Unit tests
        run: npx vitest run

      - name: Build (static generate)
        run: npm run generate

      - name: Verify prerendered routes exist
        run: |
          for route in index.html Sessions/index.html Settings/index.html channels/index.html; do
            test -f ".output/public/$route" || { echo "MISSING: $route"; exit 1; }
          done
          echo "All critical routes prerendered."
